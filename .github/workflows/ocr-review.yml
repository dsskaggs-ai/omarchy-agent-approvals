name: OCR Code Review
on:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm install -g @alibaba-group/open-code-review@1.12.7
      - name: Run OCR
        env:
          OCR_KEY: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ocr config set llm.url "https://api.z.ai/api/coding/paas/v4/"
          ocr config set llm.auth_token "$OCR_KEY"
          ocr config set llm.model "glm-5.3"
          ocr config set llm.use_anthropic false
          BASE=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          ocr review --from "$BASE" --to "$HEAD_SHA" --format json --output /tmp/ocr.json
      - name: Comment findings
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let d = null;
            try { d = JSON.parse(fs.readFileSync('/tmp/ocr.json', 'utf8')); } catch (e) {}
            let body;
            if (d === null) {
              body = '**OCR Code Review** — review failed to produce results. This is NOT a clean pass; check the workflow logs.';
            } else {
              const cs = Array.isArray(d.comments) ? d.comments : [];
              body = cs.length
                ? `**OCR Code Review** — ${cs.length} finding(s)\n` +
                  cs.map(c => `- **${c.severity || '?'}** ${c.path || '?'} L${c.start_line || '?'}: ${String(c.content || '').slice(0, 300)}`).join('\n')
                : '**OCR Code Review** — clean, no findings.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
